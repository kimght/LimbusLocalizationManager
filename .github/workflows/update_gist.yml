name: Update Localizations Gist

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: tools/updater/uv.lock

      - name: Run update script
        env:
          GITHUB_GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_UPDATE_TOKEN }}
          CHAPTERS_URL: ${{ vars.CHAPTERS_URL }}
        run: uv run --project tools/updater --frozen --no-dev llm-updater gist --config data/localizations.toml