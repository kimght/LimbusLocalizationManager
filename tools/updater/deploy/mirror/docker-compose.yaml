services:
  update-mirror:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: mirror
    volumes:
      - ../../../../data/localizations.toml:/app/localizations.toml:ro
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CONFIG_URL: "${CONFIG_URL:-}"
      CONFIG_PATH: "${CONFIG_PATH:-}"
      CHAPTERS_URL: "${CHAPTERS_URL:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_PROXY: "${GITHUB_PROXY:-}"
      HTTP_METADATA_TIMEOUT: "${HTTP_METADATA_TIMEOUT:-}"
      HTTP_DOWNLOAD_TIMEOUT: "${HTTP_DOWNLOAD_TIMEOUT:-}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL:-}"
      MINIO_BUCKET: "${MINIO_BUCKET:-localizations}"
      MINIO_SECURE: "${MINIO_SECURE:-false}"

  minio:
    image: "${MINIO_IMAGE:-minio/minio:latest}"
    container_name: minio
    restart: unless-stopped
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      # MINIO_SERVER_URL: "${MINIO_SERVER_URL}"
      MINIO_BROWSER: "off"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`${MINIO_DOMAIN}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"

  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certs:/letsencrypt"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

volumes:
  minio-data:
  traefik-certs:
